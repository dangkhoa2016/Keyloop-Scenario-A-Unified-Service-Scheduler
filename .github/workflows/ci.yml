name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js 24 · scheduler and SQLite tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check public/js/main.js
      - name: Validate notebook JSON
        run: |
          python3 -m json.tool notebooks/Scenario_A_Reviewer_Demo.ipynb > /dev/null
      - name: Check for private runtime files
        run: |
          ! git ls-files | grep -E '(^\.runtime/|^data/.*\.sqlite|^backups/|^evidence/)'
